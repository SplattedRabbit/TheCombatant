<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Combatant — D&D 3.5e Character Sheet & Campaign Suite" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=IM+Fell+English+SC&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      // Dynamische Pfadauflösung für PWA-Assets (funktioniert lokal und auf GitHub Pages)
      const baseDir = window.location.pathname.endsWith('/') 
        ? window.location.pathname 
        : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = baseDir + 'manifest.json';
      document.head.appendChild(manifestLink);

      const appleIconLink = document.createElement('link');
      appleIconLink.rel = 'apple-touch-icon';
      appleIconLink.href = baseDir + 'icon-192.png';
      document.head.appendChild(appleIconLink);
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Combat Sheet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker: Only in production (GitHub Pages); in local dev mode / LAN, auto-unregister and clear cache to enable instant updates
      if ('serviceWorker' in navigator) {
        const isLocalDev = location.hostname === 'localhost' || 
                           location.hostname === '127.0.0.1' || 
                           location.hostname.startsWith('192.168.') || 
                           location.hostname.startsWith('10.') || 
                           location.hostname.startsWith('172.') || 
                           location.hostname.endsWith('.local') ||
                           location.port !== '';
        if (isLocalDev) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./service-worker.js')
              .then(reg => console.log('[SW] Registriert:', reg.scope))
              .catch(err => console.warn('[SW] Registrierung fehlgeschlagen:', err));
          });
        }
      }
    </script>
  </body>
</html>
