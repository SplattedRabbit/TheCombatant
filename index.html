<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="D&D 3.5e Combat App — Offline combat sheet for players and Dungeon Masters" />
    <title>D&D 3.5e Combat App</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <script>
      // Dynamische Pfadauflösung für PWA-Assets (funktioniert lokal und auf GitHub Pages)
      const baseDir = window.location.pathname.endsWith('/') 
        ? window.location.pathname 
        : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = baseDir + 'manifest.json';
      document.head.appendChild(manifestLink);

      const appleIconLink = document.createElement('link');
      appleIconLink.rel = 'apple-touch-icon';
      appleIconLink.href = baseDir + 'icon-192.png';
      document.head.appendChild(appleIconLink);
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Combat Sheet" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <!-- PeerJS: globales window.Peer-Objekt, bewusst außerhalb des Vite-Bundles -->
    <script src="./peerjs.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registrierung (Offline-Modus via dist/service-worker.js)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js')
            .then(reg => console.log('[SW] Registriert:', reg.scope))
            .catch(err => console.warn('[SW] Registrierung fehlgeschlagen:', err));
        });
      }
    </script>
  </body>
</html>
